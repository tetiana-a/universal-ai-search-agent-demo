name: Campaign dispatch (hourly)

# Vercel Hobby runs crons once a day. This wave lets the bot publish campaign
# tasks at their scheduled hours (/schedule). It only calls the signed endpoint;
# the endpoint itself does nothing unless CAMPAIGN_AUTOPOST=on and a campaign was
# approved by the owner. Needs repository secret CRON_SECRET (same value as in Vercel).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call dispatch endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://universal-ai-search-agent-demo.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set; skipping"; exit 0; fi
          curl -sS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/campaigns/dispatch"
